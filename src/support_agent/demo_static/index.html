<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNR Support Agent — Case Walkthrough</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141b2d;--line:#2d3852;--muted:#a8b4ca;--ok:#63d9a0;--bad:#ff8a8a;--accent:#86b9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf2ff;font:15px/1.55 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:28px}h1{margin:0;font-size:28px}h2{margin:30px 0 10px;font-size:20px}.muted{color:var(--muted)}.setup,.outcome,.trace-row{background:var(--panel);border:1px solid var(--line);border-radius:9px}.setup{padding:18px;margin-top:24px}.scenario{font-size:17px;margin:5px 0 18px}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}label{display:block}.label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}select,textarea,button{width:100%;padding:10px;background:#1b2740;color:white;border:1px solid var(--line);border-radius:6px;font:inherit}textarea{min-height:105px;resize:vertical;margin-top:5px}textarea:read-only{color:#c5cee0;background:#111827}button{width:auto;min-width:120px;background:#285ea8;cursor:pointer}button:disabled{opacity:.6}.boundary{font-size:13px;color:var(--muted);margin:10px 0 0}.outcome{padding:18px;border-left:4px solid var(--ok)}.outcome.failed{border-left-color:var(--bad)}.outcome strong{display:block;font-size:22px}.trace{display:grid;gap:10px}.trace-row{padding:15px;display:grid;grid-template-columns:110px 1fr;gap:14px}.category{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700}.trace-row h3{margin:0 0 8px;font-size:17px}.section-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:9px}.fields{margin:2px 0 8px}.field{display:grid;grid-template-columns:minmax(150px,35%) 1fr;gap:10px;padding:3px 0}.field dt{color:var(--muted)}.field dd{margin:0}.logic{padding:7px 0}.result{margin:2px 0 9px;padding:9px;background:#0c1220;border-radius:6px}.why{color:var(--muted);font-size:13px}.boundaries{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:13px}details{margin-top:9px}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090d18;padding:10px;border-radius:5px;max-height:360px;overflow:auto}.eval{margin:28px 0}.eval article{border-left:2px solid var(--line);padding:4px 14px;margin:12px 0}.eval h3{margin:0}.eval-evidence{margin:3px 0 8px}.pass{color:var(--ok)}@media(max-width:650px){main{padding:17px}.controls{grid-template-columns:1fr}.controls button{width:100%}.trace-row{grid-template-columns:1fr}.field{grid-template-columns:1fr;gap:0}}
</style></head><body><main><header><h1>Synthetic Ecommerce Retailer Support Agent</h1><div class="muted">Delivered-not-received support: interpret reports, retrieve order, shipment, and carrier evidence, apply deterministic policy and authority controls, then execute or escalate.</div></header>
<section class="setup"><span class="label">Scenario</span><div id="prompt" class="scenario"></div><div id="examples" class="boundary"></div><div class="controls"><label><span class="label">Fault injection / test control</span><select id="scenario"></select></label><label><span class="label">Extraction mode</span><select id="mode"></select></label><button id="run">Run case</button></div><label><span class="label" style="margin-top:14px">Customer message</span><textarea id="message"></textarea></label><p id="mode-note" class="boundary"></p></section>
<section id="app"></section></main><script>
const $=s=>document.querySelector(s), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), pretty=v=>esc(JSON.stringify(v,null,2)), readable=v=>typeof v==='object'?JSON.stringify(v):String(v??'—');
let opts,scenarios,modes;
function selected(){return scenarios.find(x=>x.id===$('#scenario').value)}
function sync(){const s=selected(),m=modes.find(x=>x.id===$('#mode').value);$('#prompt').textContent=s.prompt;$('#examples').textContent=`Supported synthetic order IDs: ${opts.synthetic_order_examples.map(x=>x.order_id).join(', ')}. ${opts.unknown_order_hint}`;$('#message').readOnly=!m.message_editable;if(!m.message_editable)$('#message').value=s.customer_message;$('#mode-note').textContent=m.id==='scripted'?'Scripted extraction for this locked fixture; arbitrary wording is not interpreted. Retailer adapters and execution are synthetic.':'Live Claude extraction: one provider call, no fallback. Retailer adapters and execution remain synthetic.'}
function tech(row){const values={structured_output:row.output,trace_events:row.technical_details};if(row.state_changed)values.execution_metadata={state_changed:true,state_before:row.state_before,state_after:row.state_after};return values}
function readableFields(fields){return fields?.length?`<div class="section-label">Input</div><dl class="fields">${fields.map(x=>`<div class="field"><dt>${esc(x.label)}</dt><dd>${esc(x.value)}</dd></div>`).join('')}</dl>`:''}
function evidenceFields(fields){return `<dl class="fields eval-evidence">${fields.map(([label,value])=>`<div class="field"><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl>`}
function issue(value){return value==='delivered_not_received'?'Delivered, not received':value}
function status(value){return String(value??'—').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function exampleEvidence(x){if(x.title==='Extraction correctness')return `<div class="section-label">Input</div>${evidenceFields([['Customer message',x.input]])}<div class="section-label">Expected</div>${evidenceFields([['Issue',issue(x.expected.issue_type)],['Order',x.expected.order_identifier]])}<div class="section-label">Actual</div>${evidenceFields([['Issue',issue(x.actual.issue_type)],['Order',x.actual.order_identifier],['Clarification required',x.actual.needs_clarification?'Yes':'No']])}`;if(x.title==='Hallucination / invalid identifier control')return `<div class="section-label">Expected</div>${evidenceFields([['Result','Reject ungrounded identifier']])}<div class="section-label">Actual</div>${evidenceFields([['Result','Rejected before workflow routing'],['Reason',x.actual]])}`;if(x.title==='Trajectory control'){const outcome=x.actual.outcome_failures.length===0?'PASS':'FAIL',trajectory=x.actual.trajectory_failures.length===0?'PASS':'FAIL';return `<div class="section-label">Scenario</div>${evidenceFields([['Scenario',x.input]])}<div class="section-label">Expected</div>${evidenceFields([['Outcome evaluator','PASS'],['Trajectory evaluator','FAIL']])}<div class="section-label">Actual</div>${evidenceFields([['Outcome evaluator',outcome],['Trajectory evaluator',trajectory],['Violation',x.actual.trajectory_failures.join('; ')||'None']])}`};return `<div class="section-label">Expected</div>${evidenceFields([['Case',status(x.expected.case_status)],['Execution',status(x.expected.execution_status)]])}<div class="section-label">Actual</div>${evidenceFields([['Case',status(x.actual.case_status)],['Execution',status(x.actual.execution_status)],['Trajectory violations',x.actual.trajectory_failures.join('; ')||'None']])}`}
function traceRow(row){const tool=row.category==='TOOL'||row.category==='ACTION'?`<div class="muted">Tool/action: ${esc(row.component)}</div>`:'';const logic=row.logic?`<div class="section-label">Logic</div><div class="logic">${esc(row.logic)}</div>`:'';return `<article class="trace-row"><div class="category">${esc(row.category)}</div><div><h3>${esc(row.action)}</h3>${tool}${readableFields(row.display_input)}${logic}<div class="section-label">Result</div><div class="result">${esc(row.result)}</div><div class="why"><span class="section-label">Why</span><br>${esc(row.why)}</div><details><summary>Technical details</summary><pre>${pretty(tech(row))}</pre><details><summary>Raw input and result</summary><pre>${pretty({raw_input:row.input,raw_result:row.output})}</pre></details></details></div></article>`}
function render(d){const failed=d.final_state?.execution_status==='failed';const coverage=d.eval_evidence.coverage.map(x=>`<article><h3>${esc(x.title)} — <span class="pass">${x.passed?'PASS':'FAIL'}</span></h3><div>${esc(x.detail)}</div><details><summary>See supporting evidence</summary><pre>${pretty(x.evidence)}</pre></details></article>`).join('');const examples=d.eval_evidence.examples.map(x=>`<article><h3>${esc(x.title)} — <span class="pass">${x.passed?'PASS':'FAIL'}</span></h3><div class="muted">${esc(x.source)}</div>${exampleEvidence(x)}<details><summary>See fixture evidence</summary><pre>${pretty({input:x.input,expected:x.expected,actual:x.actual})}</pre></details></article>`).join('');$('#app').innerHTML=`<h2>Customer-facing outcome</h2><div class="outcome ${failed?'failed':''}"><strong>${esc(d.customer_outcome.title)}</strong><div>${esc(d.customer_outcome.message)}</div></div><details class="boundaries"><summary>Demo boundaries</summary><div>${esc(d.mode.label)}</div>${d.boundaries.map(x=>`<div>${esc(x)}</div>`).join('')}</details><h2>Execution trace</h2><div class="trace">${d.execution_trace.map(traceRow).join('')}</div><details><summary>Full raw workflow trace (0–${Math.max(0,d.raw_workflow_trace.length-1)})</summary><pre>${pretty(d.raw_workflow_trace)}</pre></details><details class="eval"><summary>How I evaluated this system</summary><div class="section-label">Evaluation coverage</div>${coverage}<div class="section-label">Representative examples</div>${examples}<p class="muted">${esc(d.eval_evidence.note)}</p></details>`}
async function run(){$('#run').disabled=true;$('#run').textContent='Running…';try{let r;try{r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario_id:$('#scenario').value,mode:$('#mode').value,customer_message:$('#message').value})})}catch(e){throw Error('Could not reach the demo server. Confirm it is still running, then try again.')}const raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){throw Error(`Demo server returned an invalid response (HTTP ${r.status}).`)}if(!r.ok)throw Error(d.error||`Demo server returned HTTP ${r.status}.`);render(d)}catch(e){$('#app').innerHTML=`<h2>Customer-facing outcome</h2><div class="outcome failed"><strong>Run stopped</strong><div>${esc(e.message)}</div></div>`}finally{$('#run').disabled=false;$('#run').textContent='Run case'}}
fetch('/api/demo-options').then(r=>r.json()).then(o=>{opts=o;scenarios=o.scenarios;modes=o.modes;$('#scenario').innerHTML=scenarios.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');$('#mode').innerHTML=modes.map(x=>`<option value="${esc(x.id)}" ${x.enabled?'':'disabled'}>${esc(x.label)}${x.enabled?'':' (server disabled)'}</option>`).join('');$('#mode').value=o.default_mode;sync()}).catch(e=>{$('#app').textContent=e.message});$('#scenario').onchange=sync;$('#mode').onchange=sync;$('#run').onclick=run;
</script></body></html>
