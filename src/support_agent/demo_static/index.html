<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNR Support Agent — Case Walkthrough</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141b2d;--line:#2d3852;--muted:#a8b4ca;--ok:#63d9a0;--bad:#ff8a8a;--accent:#86b9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf2ff;font:15px/1.55 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:28px}h1{margin:0;font-size:28px}h2{margin:30px 0 10px;font-size:20px}.muted{color:var(--muted)}.setup,.outcome,.trace-row{background:var(--panel);border:1px solid var(--line);border-radius:9px}.setup{padding:18px;margin-top:24px}.scenario{font-size:17px;margin:5px 0 18px}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}label{display:block}.label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}select,textarea,button{width:100%;padding:10px;background:#1b2740;color:white;border:1px solid var(--line);border-radius:6px;font:inherit}textarea{min-height:105px;resize:vertical;margin-top:5px}textarea:read-only{color:#c5cee0;background:#111827}button{width:auto;min-width:120px;background:#285ea8;cursor:pointer}button:disabled{opacity:.6}.boundary{font-size:13px;color:var(--muted);margin:10px 0 0}.outcome{padding:18px;border-left:4px solid var(--ok)}.outcome.failed{border-left-color:var(--bad)}.outcome strong{display:block;font-size:22px}.trace{display:grid;gap:10px}.trace-row{padding:15px;display:grid;grid-template-columns:110px 1fr;gap:14px}.category{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700}.trace-row h3{margin:0 0 2px;font-size:17px}.result{margin:9px 0;padding:9px;background:#0c1220;border-radius:6px}.why,.next{color:var(--muted);font-size:13px}.next{margin-top:8px}.pill{display:inline-block;padding:2px 7px;border-radius:10px;background:#223451;color:#dbe8ff;font-size:12px}details{margin-top:9px}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090d18;padding:10px;border-radius:5px;max-height:360px;overflow:auto}.eval{margin:28px 0}.eval article{border-left:2px solid var(--line);padding:4px 14px;margin:12px 0}.eval h3{margin:0}.pass{color:var(--ok)}@media(max-width:650px){main{padding:17px}.controls{grid-template-columns:1fr}.controls button{width:100%}.trace-row{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Synthetic Ecommerce Retailer Support Agent</h1><div class="muted">Delivered-not-received support: interpret reports, retrieve order, shipment, and carrier evidence, apply deterministic policy and authority controls, then execute or escalate.</div></header>
<section class="setup"><span class="label">Scenario</span><div id="prompt" class="scenario"></div><div id="examples" class="boundary"></div><div class="controls"><label><span class="label">Execution mode</span><select id="scenario"></select></label><label><span class="label">Extraction mode</span><select id="mode"></select></label><button id="run">Run case</button></div><label><span class="label" style="margin-top:14px">Customer message</span><textarea id="message"></textarea></label><p id="mode-note" class="boundary"></p></section>
<section id="app"></section></main><script>
const $=s=>document.querySelector(s), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), pretty=v=>esc(JSON.stringify(v,null,2));
let opts,scenarios,modes;
function selected(){return scenarios.find(x=>x.id===$('#scenario').value)}
function sync(){const s=selected(),m=modes.find(x=>x.id===$('#mode').value);$('#prompt').textContent=s.prompt;$('#examples').textContent=`Supported synthetic order IDs: ${opts.synthetic_order_examples.map(x=>x.order_id).join(', ')}. ${opts.unknown_order_hint}`;$('#message').readOnly=!m.message_editable;if(!m.message_editable)$('#message').value=s.customer_message;$('#mode-note').textContent=m.id==='scripted'?'Scripted extraction for this locked fixture; arbitrary wording is not interpreted. Retailer adapters and execution are synthetic.':'Live Claude extraction: one provider call, no fallback. Retailer adapters and execution remain synthetic.'}
function tech(row){return {input:row.input,output:row.output,state_changed:row.state_changed,state_before:row.state_before,state_after:row.state_after,events:row.technical_details}}
function traceRow(row){const tool=row.category==='TOOL'||row.category==='ACTION'?`<div class="muted">Tool: ${esc(row.component)}</div>`:'';return `<article class="trace-row"><div class="category">${esc(row.category)}</div><div><h3>${esc(row.action)}</h3>${tool}<div class="result"><b>Result:</b> ${esc(row.result)}</div><div class="why">Why: ${esc(row.why)}</div><div class="next">Next: ${esc(row.next)}</div><details><summary>Technical details</summary><pre>${pretty(tech(row))}</pre></details></div></article>`}
function render(d){const failed=d.final_state?.execution_status==='failed';$('#app').innerHTML=`<h2>Customer-facing outcome</h2><div class="outcome ${failed?'failed':''}"><strong>${esc(d.customer_outcome.title)}</strong><div>${esc(d.customer_outcome.message)}</div><div class="boundary">${esc(d.mode.label)} · ${d.boundaries.map(esc).join(' · ')}</div></div><h2>Execution trace</h2><div class="trace">${d.execution_trace.map(traceRow).join('')}</div><details class="eval"><summary>How I evaluated this system</summary>${d.eval_evidence.examples.map(x=>`<article><h3>${esc(x.title)} — <span class="pass">${x.passed?'pass':'fail'}</span></h3><div class="muted">${esc(x.source)}</div><details><summary>See fixture evidence</summary><pre>${pretty({input:x.input,expected:x.expected,actual:x.actual})}</pre></details></article>`).join('')}<p class="muted">${esc(d.eval_evidence.note)}</p></details>`}
async function run(){$('#run').disabled=true;$('#run').textContent='Running…';try{let r;try{r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario_id:$('#scenario').value,mode:$('#mode').value,customer_message:$('#message').value})})}catch(e){throw Error('Could not reach the demo server. Confirm it is still running, then try again.')}const raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){throw Error(`Demo server returned an invalid response (HTTP ${r.status}).`)}if(!r.ok)throw Error(d.error||`Demo server returned HTTP ${r.status}.`);render(d)}catch(e){$('#app').innerHTML=`<h2>Customer-facing outcome</h2><div class="outcome failed"><strong>Run stopped</strong><div>${esc(e.message)}</div></div>`}finally{$('#run').disabled=false;$('#run').textContent='Run case'}}
fetch('/api/demo-options').then(r=>r.json()).then(o=>{opts=o;scenarios=o.scenarios;modes=o.modes;$('#scenario').innerHTML=scenarios.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');$('#mode').innerHTML=modes.map(x=>`<option value="${esc(x.id)}" ${x.enabled?'':'disabled'}>${esc(x.label)}${x.enabled?'':' (server disabled)'}</option>`).join('');$('#mode').value=o.default_mode;sync()}).catch(e=>{$('#app').textContent=e.message});$('#scenario').onchange=sync;$('#mode').onchange=sync;$('#run').onclick=run;
</script></body></html>
